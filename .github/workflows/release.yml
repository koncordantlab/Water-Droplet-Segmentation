name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege: read the repo, write the GHCR package. No custom secrets.
permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    # A wedged registry push shouldn't hold the release queue for the 6 h default.
    timeout-minutes: 60
    # Actions are SHA-pinned (tag in the trailing comment): this workflow holds
    # packages:write on a public repo, and a hijacked action tag could publish a
    # poisoned image the deploy box would pull. Dependabot keeps the pins fresh.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          # lowercase is mandatory for GHCR; repo display name is mixed-case
          images: ghcr.io/koncordantlab/water-droplet-segmentation
          tags: |
            # latest only from main: a manual dispatch on another ref must not
            # repoint the tag the deploy box pulls
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # gha cache may evict the multi-GB torch layer; acceptable — a cold
          # build is ~10 min and correctness never depends on the cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max
